name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: the workflow token can only read the repo.
permissions:
  contents: read

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.22"
          cache: npm
      # --ignore-scripts: no dependency may run code at install time (supply-chain worms
      # ride preinstall/postinstall). Native-binary deps here (esbuild, unrs-resolver)
      # ship prebuilt optional packages, so nothing needs a build step.
      - run: npm ci --ignore-scripts
      # The shell-session tests boot a private tmux server with a zsh login shell and skip
      # themselves when either is missing, so install both or SHELL-01 is never verified in CI.
      - run: sudo apt-get update && sudo apt-get install -y tmux zsh
      - name: npm run check
        run: npm run check

  visual:
    name: visual
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install chromium
      - run: npm run build
      - run: npm run test:visual
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
