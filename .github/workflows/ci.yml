name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: the workflow token can only read the repo.
permissions:
  contents: read

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.22"
          cache: npm
      # --ignore-scripts: no dependency may run code at install time (supply-chain worms
      # ride preinstall/postinstall). Native-binary deps here (esbuild, unrs-resolver)
      # ship prebuilt optional packages, so nothing needs a build step.
      - run: npm ci --ignore-scripts
      # The shell-session tests boot a private tmux server with a zsh login shell and skip
      # themselves when either is missing, so install both or SHELL-01 is never verified in CI.
      - run: sudo apt-get update && sudo apt-get install -y tmux zsh
      - name: npm run check
        run: npm run check

  visual:
    name: visual
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install chromium
      - run: npm run build
      - run: npm run test:visual
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
