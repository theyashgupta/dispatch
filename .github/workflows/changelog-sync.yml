name: Changelog sync

on:
  release:
    types: [published]

permissions: {}

jobs:
  notify-site:
    name: notify-site
    runs-on: ubuntu-latest
    steps:
      - name: Send release-published to dispatch-site
        env:
          SITE_DEPLOY_TOKEN: ${{ secrets.SITE_DEPLOY_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ -z "$SITE_DEPLOY_TOKEN" ]; then
            echo "SITE_DEPLOY_TOKEN is not set, so the site redeploy is skipped."
            exit 0
          fi
          jq -nc --arg tag "$TAG" '{event_type: "release-published", client_payload: {tag: $tag}}' |
            curl --fail-with-body -sS -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $SITE_DEPLOY_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              --data-binary @- \
              https://api.github.com/repos/theyashgupta/dispatch-site/dispatches
