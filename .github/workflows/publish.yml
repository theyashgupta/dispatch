name: Publish

on:
  push:
    tags:
      - "v*"

# npm Trusted Publishing (OIDC): the job proves its identity to npm with a short-lived
# GitHub-issued token instead of a stored NPM_TOKEN secret. Nothing long-lived exists
# to steal, and npm attaches build provenance automatically.
# One-time setup on npmjs.com → package @theyashgupta/dispatch → Settings → Trusted
# Publisher: GitHub Actions, repo theyashgupta/dispatch, workflow publish.yml.
# setup-node must NOT be given registry-url: it writes an .npmrc carrying
# //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN} and exports a placeholder token.
# npm then authenticates with that placeholder instead of exchanging an OIDC token,
# and the registry answers 404. npm defaults to registry.npmjs.org anyway.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: publish
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.22"
          cache: npm
      # Node 22 bundles npm 10; trusted publishing needs npm >= 11.5.1.
      - run: npm install -g npm@latest
      - name: Report publish preconditions
        run: |
          echo "npm: $(npm -v)"
          echo "node: $(node -v)"
          echo "id-token url present: ${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}"
          echo "npmrc files:"; ls -la ~/.npmrc "$NPM_CONFIG_USERCONFIG" 2>/dev/null || true
          npm config get registry
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Check calendar helper
        run: test -x dist/native/DispatchCalendar.app/Contents/MacOS/DispatchCalendar
      - run: npm publish --access public
