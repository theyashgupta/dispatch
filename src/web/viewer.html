<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Dispatch Viewer</title>
    <style>
      html,
      body {
        background: #0b0c0e;
        color: #e8e9ea;
        margin: 0;
        width: 100%;
        height: 100%;
      }
      /* tokens.css's #root { height: 100vh; overflow: hidden } is board-only (the board owns its
         own internal scroll containers); the viewer is a plain scrolling document. `html body
         #root` outranks tokens.css's bare `#root` on specificity alone, so this wins regardless
         of stylesheet load order. */
      html body #root {
        height: auto;
        min-height: 100%;
        overflow: visible;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/viewer-main.tsx"></script>
  </body>
</html>
