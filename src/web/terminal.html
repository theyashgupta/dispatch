<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Dispatch Terminal</title>
    <style>
      html,
      body {
        background: transparent;
        color: #e8e9ea;
        margin: 0;
        width: 100%;
        height: 100%;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }
      #terminal {
        width: 100%;
        height: 100%;
      }
      @media (pointer: coarse) {
        #terminal,
        #terminal .xterm {
          touch-action: none;
        }
      }
      .dsp-zoom-chip {
        display: none;
      }
      .dsp-zoom-chip[hidden] {
        display: none;
      }
      @media (pointer: coarse) {
        .dsp-zoom-chip {
          display: flex;
          align-items: center;
          gap: 4px;
          position: fixed;
          right: 12px;
          bottom: calc(12px + env(safe-area-inset-bottom));
          z-index: 10;
          padding: 4px;
          border-radius: 999px;
          background: #0b0c0e;
          border: 1px solid #2a2c30;
          opacity: 0;
          pointer-events: none;
          transition: opacity 160ms ease;
          touch-action: manipulation;
          user-select: none;
          -webkit-user-select: none;
        }
        .dsp-zoom-chip[data-visible="true"] {
          opacity: 1;
          pointer-events: auto;
        }
        .dsp-zoom-chip button {
          min-width: 32px;
          min-height: 32px;
          border: none;
          border-radius: 999px;
          background: transparent;
          color: #e8e9ea;
          font-size: 16px;
          line-height: 1;
        }
        .dsp-zoom-chip__level {
          min-width: 3.5em;
          text-align: center;
          font-size: 12px;
          color: #e8e9ea;
        }
      }
    </style>
  </head>
  <body>
    <div id="terminal"></div>
    <div class="dsp-zoom-chip" hidden>
      <button
        type="button"
        data-zoom="out"
        tabindex="-1"
        aria-label="Decrease terminal zoom"
      >
        &minus;
      </button>
      <span class="dsp-zoom-chip__level" aria-live="polite">100%</span>
      <button
        type="button"
        data-zoom="in"
        tabindex="-1"
        aria-label="Increase terminal zoom"
      >
        +
      </button>
    </div>
    <script type="module" src="/terminal-main.ts"></script>
  </body>
</html>
